[project]
name = "showdown-coach"
version = "0.1.0"
dependencies = [
    "fastapi", "uvicorn", "typer", "rich", "google-genai",
    "python-dotenv", "pydantic-settings", "chromadb", "requests",
]

[project.scripts]
showdown-coach = "app.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]